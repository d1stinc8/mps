[project]
name = "mps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "physics-tenpy>=1.1.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests/python"]
